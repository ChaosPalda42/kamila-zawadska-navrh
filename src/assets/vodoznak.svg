<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470" width="520" height="470" role="presentation">
<!-- Vodoznak pro odvážnější variantu vzhledu, horní roh: dřevěná složka,
     kolečko dřeva s letokruhy, tři desky složené na sebe a bedýnka.
     Spodní roh kreslí druhý soubor, vodoznak-dole.svg.

     Ze zápisu schůzky: „prvky dřeva v pozadí jako velmi světlý hnědý
     vodoznak, aby web otepli a rozbil čistě bílou barvu". Proto je kresba
     čárová a hodně průhledná — nikdy nesmí konkurovat obrazům ani textu.
     Hloubka (to „3D") se dělá horní a boční plochou předmětu, ne stínem.

     POZOR: v XML komentáři nesmí být dvojitý spojovník, rozbije to parser
     i ImageMagick. Náhled se dělá v prohlížeči, ne přes „magick". -->
<g fill="none" stroke="#4a2600" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.075">

<!-- dřevěná složka na kresby: přední deska, horní plocha, bok a gumička -->
<g transform="translate(18 42) rotate(-5)">
<path d="M0 0 H180 V124 H0 Z"/>
<path d="M0 0 L14 -11 H194 L180 0"/>
<path d="M180 0 L194 -11 V113 L180 124"/>
<path d="M0 34 H180"/>
<path d="M180 34 L194 23"/>
<path d="M116 0 V124"/>
<path d="M116 0 L130 -11"/>
<path d="M12 62 C 70 56, 120 70, 168 60"/>
<path d="M12 92 C 60 88, 126 98, 168 90"/>
</g>

<!-- kolečko dřeva: letokruhy nejsou soustředné, proto každý má svůj střed -->
<g>
<circle cx="378" cy="124" r="104"/>
<circle cx="380" cy="127" r="86"/>
<circle cx="383" cy="130" r="67"/>
<circle cx="386" cy="132" r="49"/>
<circle cx="389" cy="134" r="32"/>
<circle cx="391" cy="136" r="16"/>
<circle cx="392" cy="137" r="5"/>
<!-- praskliny od středu ke kraji, jak dřevo sesychá -->
<path d="M393 132 C 406 106, 418 74, 424 38"/>
<path d="M386 142 C 358 158, 326 172, 296 180"/>
</g>

<!-- tři desky na sobě; každá má přední, horní a boční plochu -->
<g transform="translate(30 268) rotate(-3)">
<path d="M0 0 H258 V72 H0 Z"/>
<path d="M0 0 L15 -12 H273 L258 0"/>
<path d="M258 0 L273 -12 V60 L258 72"/>
<path d="M12 22 C 84 15, 170 29, 246 20"/>
<path d="M12 42 C 92 36, 168 48, 246 40"/>
<path d="M12 58 C 70 54, 150 62, 246 56"/>
<ellipse cx="196" cy="33" rx="13" ry="8"/>
<ellipse cx="196" cy="33" rx="5" ry="3"/>
</g>

<g transform="translate(52 338) rotate(2)">
<path d="M0 0 H236 V62 H0 Z"/>
<path d="M0 0 L13 -11 H249 L236 0"/>
<path d="M236 0 L249 -11 V51 L236 62"/>
<path d="M11 19 C 76 13, 154 26, 224 17"/>
<path d="M11 40 C 88 35, 150 46, 224 38"/>
<ellipse cx="62" cy="30" rx="11" ry="7"/>
<ellipse cx="62" cy="30" rx="4" ry="2.5"/>
</g>

<g transform="translate(20 398) rotate(-1)">
<path d="M0 0 H214 V44 H0 Z"/>
<path d="M0 0 L12 -10 H226 L214 0"/>
<path d="M214 0 L226 -10 V34 L214 44"/>
<path d="M10 16 C 70 11, 142 23, 203 15"/>
<path d="M10 32 C 82 28, 140 36, 203 30"/>
</g>

<!-- bedýnka z prken, shora otevřená -->
<g transform="translate(336 312) rotate(2)">
<path d="M0 0 H150 V104 H0 Z"/>
<path d="M0 0 L16 -13 H166 L150 0"/>
<path d="M150 0 L166 -13 V91 L150 104"/>
<path d="M12 -3 L26 -13 H156 L142 -3 Z"/>
<path d="M0 34 H150"/>
<path d="M0 38 H150"/>
<path d="M0 68 H150"/>
<path d="M0 72 H150"/>
<path d="M11 0 V104"/>
<path d="M139 0 V104"/>
</g>

</g>
</svg>
