name: Nasazení ukázky na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v5
      - name: Závislosti
        run: uv sync
      - name: Sestavit web
        # Záměrně v režimu ukázky: klientka má vidět pás „ukázka“,
        # mockup správy webu a košík, který nikam neodesílá.
        run: node build.mjs
      - name: Akceptační testy
        run: uv run pytest -q
      - name: Brána nad hotovým webem
        run: uv run python -m tools.kontrola_webu out
      - name: Přesadit do podadresáře Pages
        run: uv run python -m tools.predvolba out "${{ github.event.repository.name }}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
